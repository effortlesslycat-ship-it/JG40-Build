<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JewishGen — Historical Borders</title>
<style>
  :root{
    --navy:#103a5c;
    --navy-2:#0c2c46;
    --gold:#9a8a3f;
    --tan:#e6ddc7;
    --ink:#1b3146;
    --muted:#6f7a86;
    --card:#ffffff;
    --line:#e4e2da;
    --parch-1:#f3ead7;
    --parch-2:#e9dcc0;
    --land:#ddd0b3;
    --land-line:#c3b489;
    --hl:#b4502f;
    --hl-soft:#d98b5f;
    --pin:#9e2b25;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:#f6f4ee;color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;padding:18px;
  }
  .wrap{max-width:780px;margin:0 auto}
  .label{font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:700;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);
    border-radius:6px;overflow:hidden;box-shadow:0 10px 34px rgba(16,58,92,.10)}

  /* era toggle */
  .toggle{display:flex;gap:8px;padding:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .pill{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:600;
    border:1px solid #cfd6dd;background:#fff;color:var(--navy);padding:9px 16px;border-radius:999px;
    cursor:pointer;transition:all .18s ease;white-space:nowrap}
  .pill:hover{border-color:var(--navy);transform:translateY(-1px)}
  .pill.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(16,58,92,.28)}

  /* jurisdiction strip */
  .jur{display:flex;background:var(--navy);color:#dfeaf3}
  .jur .cell{padding:9px 14px;font-family:"Helvetica Neue",Arial,sans-serif}
  .jur .h{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#9fc0da;display:block;margin-bottom:2px}
  .jur .v{font-size:13px;font-weight:600;color:#fff}
  .jur .v.dim{color:#7f9bb2;font-weight:500}

  /* map */
  .mapwrap{position:relative;background:linear-gradient(135deg,var(--parch-1),var(--parch-2));}
  svg{display:block;width:100%;height:auto}
  .era-badge{position:absolute;top:12px;left:12px;background:var(--navy);color:#fff;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;
    padding:6px 12px;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .coords{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.9);
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--ink);
    padding:4px 9px;border-radius:3px;border:1px solid rgba(0,0,0,.06)}
  .ruled{position:absolute;top:12px;right:12px;text-align:right;max-width:60%}
  .ruled .terr{font-size:21px;font-weight:600;color:var(--navy);line-height:1.1;
    text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .ruled .sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--hl);font-weight:700;margin-top:3px}

  path.terr{stroke:var(--land-line);stroke-width:.6;fill:var(--land);
    transition:fill .5s ease, opacity .5s ease;cursor:default}
  path.terr.hl{fill:var(--hl-soft);stroke:var(--hl);stroke-width:1.3}
  path.terr:hover{fill:#cdbf9f}
  path.terr.hl:hover{fill:var(--hl)}
  .grat{stroke:#b8a983;stroke-width:.4;opacity:.35;fill:none}
  .anchor{cursor:default}
  .anchor-dot{fill:#5b6b78;stroke:#fff;stroke-width:.8;opacity:.7}
  .anchor:hover .anchor-dot{fill:var(--navy);opacity:1}
  .anchor-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;fill:#37434e;
    pointer-events:none;letter-spacing:.02em;opacity:0;transition:font-size .1s ease;
    paint-order:stroke;stroke:var(--parch-1);stroke-width:3px;stroke-linejoin:round}
  .anchor.t1 .anchor-label{opacity:.92}
  .anchor:hover .anchor-label{opacity:1;font-size:13.5px;font-weight:700;fill:var(--navy)}
  .today path{fill:none;stroke:#2c3e50;stroke-width:1;stroke-dasharray:3 3;opacity:.55;pointer-events:none}
  .terr-label{font-family:"Iowan Old Style",Palatino,Georgia,serif;fill:#6a5a36;
    font-size:11px;font-style:italic;pointer-events:none;text-anchor:middle;opacity:.0;
    paint-order:stroke;stroke:var(--parch-1);stroke-width:3.2px;stroke-linejoin:round;
    animation:fade .8s ease .25s forwards}
  .hl-label{fill:#7a2f18;font-weight:700;font-style:normal;font-size:13px}
  .pin text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  @keyframes fade{to{opacity:.85}}
  .ctrl{padding:0 14px 12px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--ink)}
  .ctrl label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .ctrl input{accent-color:var(--navy);width:15px;height:15px}

  .pin{transform-origin:center;animation:drop .5s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .pin-pulse{fill:var(--pin);opacity:.25;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{r:5;opacity:.4}70%{r:20;opacity:0}100%{opacity:0}}

  .caption{padding:14px 16px;border-top:1px solid var(--line);background:#fcfbf7}
  .caption p{margin:0;font-size:15px;line-height:1.55;color:#33404e}
  .caption .src{margin-top:8px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .tip{position:absolute;pointer-events:none;background:var(--navy-2);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;padding:4px 8px;border-radius:4px;opacity:0;transition:opacity .12s;transform:translate(-50%,-130%);white-space:nowrap;z-index:5}
  .note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:#8a5a2a;background:#fbf1df;
    border:1px solid #ecd9b6;border-radius:4px;padding:3px 8px;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="label" style="margin:2px 4px 10px">JewishGen Communities Database — concept demo</div>
  <div class="card">
    <div class="toggle" id="toggle"></div>
    <div class="ctrl"><label><input type="checkbox" id="todayToggle"> Overlay today&rsquo;s borders (dotted) for orientation</label></div>
    <div class="jur" id="jur"></div>
    <div class="mapwrap" id="mapwrap">
      <div class="era-badge" id="eraBadge"></div>
      <div class="ruled"><div class="terr" id="terrName"></div></div>
      <div class="coords">50°05′ N, 19°55′ E</div>
      <svg id="map" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" aria-label="historical map"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="caption"><p id="cap"></p><div class="src">Borders: <em>historical-basemaps</em> (open data) · the dataset's <strong>SUBJECTO</strong> field names the ruling power, shown above-right.</div></div>
  </div>
</div>

const ERAS = [

   jur:["Kraków","Kraków","Galicia","Austrian Empire"],
   terr:"Austria-Hungary", sub:"Sovereign power: Austria-Hungary",

  {key:"1930", pill:"Interwar (c. 1930)", badge:"INTERWAR · c. 1930",

const NICE = {"Austria Hungary":"Austria-Hungary","Russian Empire":"Russian Empire","Ottoman Empire":"Ottoman Empire",
  "Sweden–Norway":"Sweden-Norway","White Russia":"Belarus (White Russia)","Germany (Soviet)":"Germany (Soviet zone)",
  "Germany (USA)":"Germany (US zone)","Germany (UK)":"Germany (British zone)","Germany (France)":"Germany (French zone)"};
function nice(n){return NICE[n]||n;}

// Orientation anchors: major cities shown faintly on every page for context.
// Names are era-aware (n: [1900,1930,1950,present]); a single string = unchanged.
const ANCHORS = [
  {lat:52.23, lng:21.01, n:"Warsaw"},
  {lat:48.21, lng:16.37, n:"Vienna"},
  {lat:47.50, lng:19.04, n:"Budapest"},
  {lat:50.08, lng:14.44, n:"Prague"},

const ERA_IDX = {"1900":0,"1930":1,"1950":2,"present":3};
function anchorName(a, eraKey){ return Array.isArray(a.n) ? a.n[ERA_IDX[eraKey]] : a.n; }

// ---- shared Mercator projection fit to the clip window (lon 4..33, lat 40..56.5) ----
const D2R=Math.PI/180;
function mx(lon){return lon*D2R;}
function my(lat){return Math.log(Math.tan(Math.PI/4 + lat*D2R/2));}
const LON0=4, LON1=33, LAT0=40, LAT1=56.5;
const W=900;
const x0=mx(LON0), x1=mx(LON1), yTop=my(LAT1), yBot=my(LAT0);
const SCALE=W/(x1-x0);
const H=(yTop-yBot)*SCALE;
const svg=document.getElementById("map");
svg.setAttribute("viewBox",`0 0 ${W} ${H.toFixed(1)}`);
function px(lon){return ((mx(lon)-x0)*SCALE);}
function py(lat){return ((yTop-my(lat))*SCALE);}

const SVGNS="http://www.w3.org/2000/svg";
function el(n,a){const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}

function ringPath(ring){
  let d="";
  for(let i=0;i<ring.length;i++){const p=ring[i];d+=(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)+" ";}
  return d+"Z";
}
function geomPath(g){
  let polys = g.type==="MultiPolygon"?g.coordinates:[g.coordinates];
  let d="";
  for(const poly of polys) for(const ring of poly) d+=ringPath(ring);
  return d;
}
function centroidOf(g){
  // crude: average of outer-ring vertices of largest polygon
  let polys = g.type==="MultiPolygon"?g.coordinates:[g.coordinates];
  let best=null,bestLen=0;
  for(const poly of polys){const r=poly[0];if(r.length>bestLen){bestLen=r.length;best=r;}}
  let sx=0,sy=0;for(const p of best){sx+=p[0];sy+=p[1];}
  return [sx/best.length, sy/best.length];
}

const tip=document.getElementById("tip");
const mapwrap=document.getElementById("mapwrap");
let showToday=false, currentEra="1900";

function render(eraKey){
  const era=ERAS.find(e=>e.key===eraKey);
  const d=DATA[eraKey];
  currentEra=eraKey;
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // graticule
  const grat=el("g",{class:"grat"});
  for(let lon=5;lon<=30;lon+=5){const p=el("path",{d:`M${px(lon).toFixed(1)} 0 L${px(lon).toFixed(1)} ${H.toFixed(1)}`});grat.appendChild(p);}
  for(let lat=42;lat<=56;lat+=2){const p=el("path",{d:`M0 ${py(lat).toFixed(1)} L${W} ${py(lat).toFixed(1)}`});grat.appendChild(p);}
  svg.appendChild(grat);

  // territories
  const labelsToDraw=[];
  d.features.forEach((f,idx)=>{
    const p=el("path",{d:geomPath(f.geom),class:"terr"+(f.hl?" hl":"")});
    p.style.opacity="0";
    p.addEventListener("mousemove",ev=>{
      const r=mapwrap.getBoundingClientRect();
      tip.textContent=nice(f.name)+(f.subjecto&&f.subjecto!==f.name?" — ruled by "+nice(f.subjecto):"");
      tip.style.left=(ev.clientX-r.left)+"px";tip.style.top=(ev.clientY-r.top)+"px";tip.style.opacity="1";
    });
    p.addEventListener("mouseleave",()=>tip.style.opacity="0");
    svg.appendChild(p);
    requestAnimationFrame(()=>{setTimeout(()=>{p.style.opacity="1";},idx*12);});
    if(f.name && f.name!=="?"){
      const c=centroidOf(f.geom);
      const cx=px(c[0]),cy=py(c[1]);
      if(cx>20&&cx<W-20&&cy>14&&cy<H-14) labelsToDraw.push({name:nice(f.name),x:cx,y:cy,hl:f.hl});
    }
  });
  // optional: dotted present-day borders overlaid for orientation
  if(showToday && eraKey!=="present"){
    const tg=el("g",{class:"today"});
    DATA["present"].features.forEach(f=>{ tg.appendChild(el("path",{d:geomPath(f.geom)})); });
    svg.appendChild(tg);
  }

  // labels (highlight last/on top)
  labelsToDraw.sort((a,b)=>a.hl-b.hl).forEach(L=>{
    const t=el("text",{x:L.x.toFixed(1),y:L.y.toFixed(1),class:"terr-label"+(L.hl?" hl-label":"")});
    t.textContent=L.name; svg.appendChild(t);
  });

  // orientation anchors (faint reference cities; labels reveal on hover)
  const TIER1=new Set(["Warsaw","Vienna","Berlin","Budapest","Prague","Lemberg","Lwów","Lviv"]);
  const ag=el("g",{class:"anchors"});
  ANCHORS.forEach(a=>{
    if(Math.abs(a.lng-19.9167)<0.12 && Math.abs(a.lat-50.0833)<0.12) return; // skip subject town
    const ax=px(a.lng), ay=py(a.lat);
    if(ax<14||ax>W-14||ay<12||ay>H-12) return; // only those in frame
    const nm=anchorName(a,eraKey);
    const g=el("g",{class:"anchor"+(TIER1.has(nm)?" t1":"")});
    g.appendChild(el("circle",{cx:ax.toFixed(1),cy:ay.toFixed(1),r:2.6,class:"anchor-dot"}));
    const lbl=el("text",{x:(ax+5).toFixed(1),y:(ay+3).toFixed(1),class:"anchor-label"});
    lbl.textContent=nm;
    g.appendChild(lbl);
    g.addEventListener("mouseenter",()=>ag.appendChild(g)); // raise hovered label above siblings
    ag.appendChild(g);
  });
  svg.appendChild(ag);

  // town pin (fixed)
  const PX=px(19.9167),PY=py(50.0833);
  const pg=el("g",{class:"pin"});
  pg.appendChild(el("circle",{cx:PX,cy:PY,class:"pin-pulse"}));
  const pin=el("path",{d:`M${PX} ${PY-22} C ${PX-9} ${PY-22} ${PX-9} ${PY-9} ${PX} ${PY} C ${PX+9} ${PY-9} ${PX+9} ${PY-22} ${PX} ${PY-22} Z`,
    fill:"var(--pin)",stroke:"#fff","stroke-width":"1.4"});
  pg.appendChild(pin);
  pg.appendChild(el("circle",{cx:PX,cy:PY-15,r:3.2,fill:"#fff"}));
  const tlabel=el("text",{x:PX,y:PY-28,"text-anchor":"middle","font-size":"12.5","font-weight":"700",fill:"#16344f","font-family":"Helvetica Neue,Arial,sans-serif"});
  tlabel.textContent="Kraków";
  pg.appendChild(tlabel);
  svg.appendChild(pg);

  // chrome text
  document.getElementById("eraBadge").textContent=era.badge;
  document.getElementById("terrName").textContent=era.terr;
  let capHtml=era.cap; if(era.note) capHtml+=`<span class="note">▸ ${era.note}</span>`;
  document.getElementById("cap").innerHTML=capHtml;

  // jurisdiction strip
  const heads=["Era","Town","District","Province","Country"];
  const vals=[era.pill.replace(/\s*\(.*\)/,""),...era.jur];
  const jur=document.getElementById("jur"); jur.innerHTML="";
  heads.forEach((h,i)=>{
    const c=document.createElement("div");c.className="cell";c.style.flex=i===0?"1.3":"1";
    const dim=(vals[i]==="—")?" dim":"";
    c.innerHTML=`<span class="h">${h}</span><span class="v${dim}">${vals[i]}</span>`;
    jur.appendChild(c);
  });
}

// build toggle
const tog=document.getElementById("toggle");
ERAS.forEach((e,i)=>{
  const b=document.createElement("button");b.className="pill"+(i===0?" active":"");b.textContent=e.pill;
  b.addEventListener("click",()=>{document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));b.classList.add("active");render(e.key);});
  tog.appendChild(b);
});
document.getElementById("todayToggle").addEventListener("change",e=>{showToday=e.target.checked;render(currentEra);});
render("1900");
